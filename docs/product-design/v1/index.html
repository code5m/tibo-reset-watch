const platformInfo={mini:['微信小程序','把一次转发，变成一次看懂。','轻量入口，先看事件，再决定是否接收提醒。保留微信标题区与胶囊空间，不要求用户先登录才能读公告。','三个底部入口','动态 / 历史 / 我的。提醒设置收在“我的”，不把运营编辑器放给普通用户。','订阅消息说明','先说明提醒价值，再发起授权；此原型不触发真实微信授权。'],ios:['苹果 iOS','少一点操作，多一点确定。','用清晰的大标题、分组内容与克制的底部导航服务个人用户；正文优先可读性，不做大面积透明底。','四个底部入口','动态 / 历史 / 提醒 / 我的。原生版接入系统字号、旁白与安全区域。','锁屏与小组件','作为未来概念；不是本版已经接通的 Live Activity 或后台实时倒计时。'],android:['安卓 Android','重要的信息，抬眼就看到。','用稳定的色调、清晰的选中态与触达明确的操作区域。平板与横屏优先适配侧边导航和双栏阅读。','Material 风格的层次','信息卡与导航层区分，提醒入口明确；不为赶截止添加多余浮动按钮。','通知权限与电量限制','展示授权与渠道状态；省电限制和服务商接受不能被当作实际送达。'],harmony:['鸿蒙 HarmonyOS','从手机，到更多屏幕。','同一轮事件在手机、折叠屏与大屏上保持同一状态。以内容连续与简洁卡片为方向，不把安卓换标当鸿蒙适配。','手机与折叠屏','手机单栏，展开后事件列表 + 来源详情；标题与返回行为遵循平台组件。','元服务与实况窗','单独概念设计，须经过 ArkUI/DevEco 集成与平台能力验证，不冒充已实现。']};
function mobileHome(){if(['offline','empty'].includes(scenario))return empty();let headline=deadline()?cn(deadline()):scenario==='banked'?'储备机会 · 资格待核验':scenario==='correction'?'仅限受影响的账户':'最晚时间未知';return `<div class="mobile-hero ${scenario==='done'?'':'alerted'}"><div class="row between"><span class="pill">${state()[0]}</span><span class="small">演示事件</span></div><div class="big">${scenario==='done'?'官方确认完成':headline}</div><p>${scenario==='done'?'个人账户到账未知，不再显示预警倒计时。':'重置最晚时间 · 北京时间 · 参考上界，可能提前'}</p><div class="chiprow"><span>同一轮事件</span><span>不代表真实公告</span></div></div><div class="mobile-section-title"><h2>原帖依据</h2><span class="small muted">左解释 · 中译文 · 右原文</span></div><div class="scrolltip">正文可左右查看；在卡片头部滑动可翻页。</div>${tweet()}<div class="info-box" style="margin-top:12px">${action()}</div><button class="btn primary" style="width:100%;margin-top:12px" data-nav="delivery">管理提醒偏好 · 原型</button>`;}
function mobileHistory(){return `<div class="mobile-section-title"><h2>历史事件</h2><span class="pill gray">全部为虚构样例</span></div><div class="mobile-history">${[['样例 A','2时20分','3时40分'],['样例 B','1时10分','50分'],['样例 C','25分','截止未知']].map(([a,b,c])=>`<div class="panel"><div class="row between"><h2>${a} · Global</h2><span class="pill">确认完成 · 示例</span></div><div class="kpis"><div class="kpi timebox"><span class="small">公告 → 官方确认</span><strong>${b}</strong></div><div class="kpi timebox"><span class="small">较参考截止提前</span><strong>${c}</strong></div></div><p class="caption">个人账户实际到账：未知</p></div>`).join('')}</div>`;}
function mobile(){if(!['overview','history','delivery','settings'].includes(page))page='overview';const info=platformInfo[platform];const nav=platform==='mini'?[['overview','动态','radar'],['history','历史','history'],['settings','我的','user']]:[['overview','动态','radar'],['history','历史','history'],['delivery','提醒','bell'],['settings','我的','user']];let content=page==='overview'?mobileHome():page==='history'?mobileHistory():page==='delivery'?delivery():`<div class="mobile-section-title"><h2>我的 ResetWatch</h2><span class="pill gray">无需 OpenAI 登录</span></div><div class="panel pad"><div class="row"><div class="avatar">我</div><div><strong>访客模式</strong><div class="small muted">先浏览，再决定是否订阅</div></div></div><div class="rule"></div><button class="btn primary" style="width:100%" data-nav="delivery">提醒与通知设置</button><button class="subtle-link" data-widget style="display:block;margin-top:10px">${platform==='harmony'?'元服务卡片':'桌面 / 锁屏小组件'} · 查看未来概念</button></div><div class="panel pad" style="margin-top:13px"><div class="row-item">个人额度<span class="pill gray">未接入</span></div><div class="row-item">系统推送<span class="pill warn">未验证</span></div><div class="row-item">主题<button class="btn" data-theme>明暗切换</button></div><p class="caption">设计原型不保存账号信息，不发送消息。</p></div>`;return `<div class="mobile-stage"><section class="device ${platform}" aria-label="${info[0]}浏览器界面原型"><div class="statusbar"><span>9:41</span><span class="island"></span><span>▮▮▮  Wi-Fi  ▰</span></div><div class="mobile-top"><div class="row" style="gap:8px"><span class="brandmark">R</span><strong>ResetWatch</strong></div>${platform==='mini'?'<span class="capsule">··· │ ◉</span>':'<span class="pill gray">设计演示</span>'}</div><div class="mobile-content">${content}</div><nav class="mobile-bottom" aria-label="客户端导航">${nav.map(([id,t,ic])=>`<button data-nav="${id}" class="${page===id?'active':''}">${icon(ic)}${t}</button>`).join('')}</nav></section><aside class="mobile-guidance"><div class="eyebrow">${platform.toUpperCase()} / CLIENT EXPERIENCE</div><h1>${info[1]}</h1><p class="blurb">${info[2]}</p><div class="spec-line"><strong>${info[3]}</strong><p>${info[4]}</p></div><div class="spec-line"><strong>${info[5]}</strong><p>${info[6]}</p></div><div class="spec-line"><strong>你确定的卡片结构不变</strong><p>圆角 X 引用框、北京与美国双时区、解释 / 中文 / 英文三栏、分页和动态时间。手机不把三栏文字硬挤在一屏。</p></div><div class="info-box" style="margin-top:22px">这是浏览器中的交互原型，不是已编译的小程序、IPA、APK 或鸿蒙安装包。外部平台能力均未在此接通。</div></aside></div>`;}
function future(){return `<main class="future"><div class="row between sectionhead"><div><div class="eyebrow">PRODUCT HORIZON / FUTURE CONCEPT</div><h2 style="margin-top:7px">从重置提醒，走向可信的 AI 用量情报。</h2></div><span class="pill gray">未来规划 · 非上线能力</span></div><section class="future-hero"><div><div class="eyebrow">RESETWATCH · YOUR TIME, BETTER USED</div><h1>把下一次重置，<br>变成下一次交付。</h1><p>一眼看懂公告依据、行动窗口与通知状态。先把 Tibo / Codex 做可靠，再扩展更多可信来源。</p><button class="btn" data-explore>查看未来用户旅程 ${icon('arrow')}</button></div><div class="ecosystem"><div class="source-card"><strong>Codex / ChatGPT Work</strong><span>首发设计范围 · 当前连接状态另行核验</span></div><div class="source-card"><strong>其他 AI 服务</strong><span>候选范围 · 未接入，不虚构重置规则</span></div><div class="source-card"><strong>团队与项目</strong><span>任务规划概念 · 不自动读取私有账户</span></div><div class="source-card"><strong>个人额度</strong><span>暂无读取能力 · 未来可探索自愿手动记录</span></div></div></section><div class="roadmap">${[['01','把提醒做可靠','当前设计优先','官方来源 → 北京时间 → 提前告警 → 状态去重 → 可审计送达。先解决晚报、误报和“看似开启却未送达”。','门槛：真实通道、失败重试与真机验证'],['02','把使用安排好','后续产品概念','桌面小组件、任务建议、历史对比、按项目收藏。仅在可靠公告窗口内提供建议，不生成概率型倒计时。','门槛：来源覆盖、权限与通知体验通过'],['03','把团队连接起来','远期产品概念','多来源订阅、团队工作区、通知分工、Webhook 与投递审计。推广内容独立授权，面向需要的人。','门槛：需求验证、角色权限与合规评估']].map(([n,t,b,d,g])=>`<section class="panel"><div class="row between"><span class="num">${n}</span><span class="pill gray">${b}</span></div><h2>${t}</h2><p>${d}</p><div class="rule"></div><p>${g}</p></section>`).join('')}</div><div class="future-widgets"><section class="panel pad"><div class="row between"><h2>桌面 / 锁屏 / 元服务卡片</h2><span class="pill gray">概念</span></div><div class="widget-example"><div class="row between"><strong>R　ResetWatch</strong><span class="pill warn">模拟 · 已宣布</span></div><div class="big">参考截止 21:00</div><p class="small muted">北京时间 · 可能提前，不是精准落地时间</p><div class="rule"></div><div class="row between small"><span>原帖依据 2 条 · 模拟</span><span>更新时间必须可见</span></div></div></section><section class="panel pad"><div class="row between"><h2>团队控制台 · 下一种产品形态</h2><span class="pill gray">概念</span></div><div class="row-item"><div>来源与事件<small>一份事实，多个团队按需订阅</small></div><span class="pill gray">未接入</span></div><div class="row-item"><div>重要任务建议<small>不在无授权时访问业务仓库</small></div><span class="pill gray">需授权</span></div><div class="row-item"><div>通知责任人 / 送达轨迹<small>不把服务商接受写成用户已读</small></div><span class="pill gray">需回执</span></div><button class="btn" data-team style="margin-top:14px">查看角色边界 ${icon('arrow')}</button></section></div></main>`;}
function system(){return `<main class="future"><div class="eyebrow">DESIGN SYSTEM / V1.0</div><h1 style="margin:10px 0">一套状态语义，五种设备表达。</h1><p class="muted">深森林绿承载品牌；琥珀只提示窗口；红色只提示故障；完成状态不冒充账户到账。</p><div class="swatches">${[['品牌','深森林','#14624d'],['背景','雾白','#f2f5f3'],['正文','深墨','#182d29'],['待执行','琥珀','#92500a'],['来源异常','警示红','#a33333'],['传播中','信息蓝','#245ab0']].map(([t,n,c])=>`<div class="swatch"><div class="color" style="background:${c}"></div><div class="label"><strong>${t} / ${n}</strong><br>${c}</div></div>`).join('')}</div><div class="stategrid">${[['已宣布','有依据但未确认完成','warn'],['传播中','传播不等于所有人到账','blue'],['已完成','官方确认发帖时间',''],['截止未知','不显示伪倒计时','gray'],['已逾期','截止已过，实际完成未知','bad'],['Banked','资格与有效期单独展示','blue'],['定向补偿','不当作全员重置','blue'],['读取失败','状态未知，不显示无事件','bad']].map(([a,b,c])=>`<div class="panel"><span class="pill ${c}">${a}</span><p>${b}</p></div>`).join('')}</div><div class="pagegrid" style="margin-top:20px"><section class="panel pad"><h2>布局与可访问性 · 设计目标</h2><div class="row-item">间距系统<span class="mono">4 / 8 / 12 / 16 / 24 / 32</span></div><div class="row-item">正文 / 次级文字<span>14–16 / 12–13</span></div><div class="row-item">操作触达<span>至少44，安卓目标48</span></div><div class="row-item">常规文字对比度<span>目标 ≥ 4.5:1</span></div><p class="caption">支持键盘、明暗主题、减少动效。动态时钟不让读屏每秒播报。系统字号与原生辅助功能留待 SDK 集成验收。</p></section><section class="panel pad"><h2>行为契约</h2>${['翻页只换帖子，不回滚整轮状态。','公告 / 承诺 / 开始传播 / 完成 / 个人到账分开。','关键时区用 IANA 名称，禁止硬编码日期。','生产错误不自动降级到演示数据。','紧急告警不等待营销稿，营销默认不勾选。','已生成 / 已发送 / 已接受 / 已送达分开。'].map(x=>`<div class="row-item small">${x}</div>`).join('')}</section></div></main>`;}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render();});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=toggleTheme);document.querySelectorAll('[data-post]').forEach(b=>b.onclick=()=>{postIndex=Number(b.dataset.post);render();});document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{postIndex--;render();});document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{postIndex++;render();});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{preferences[b.dataset.toggle]=!preferences[b.dataset.toggle];b.setAttribute('aria-checked',String(preferences[b.dataset.toggle]));toast('仅更新原型偏好，未更改真实订阅。');});document.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>{draftMode=b.dataset.draft;render();});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(draft());toast('演示草稿已复制；未对外发布。');}catch{modal('复制权限不可用','可在稿件区域手动选中文本复制。草稿明确标为演示，禁止当新闻发布。');}});document.querySelectorAll('[data-test-notification]').forEach(b=>b.onclick=()=>modal('测试通知的真实验收路径','先验证用户授权与设备注册，再确认服务端发出、服务商接受与可用回执。原型没有连接任何推送服务，不会显示“测试成功”。'));document.querySelectorAll('[data-action-plan]').forEach(b=>b.onclick=()=>modal('把窗口留给已明确的重要工作','优先审查已有改动、实现确定功能、运行自动测试与完成必要调研。不为了刷额度创建无意义任务，也不在没有授权时自动执行代码。'));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>modal('校对来源，而不是替来源下结论','依次核对作者、永久链接、发布时间、原文与同轮事件关系。填写翻译和解释后保存；确认来源不意味着自动群发。'));document.querySelectorAll('[data-design-info]').forEach(b=>b.onclick=()=>modal('这次交付是界面设计与交互原型','此页面基于已经合并的产品范围延续设计。新增提醒管理、送达审计、小组件、团队概念均需后续接口和原生平台集成；没有修改生产数据库或推送配置。'));document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>toast('演示：保留当前错误/空状态，不伪造成功响应。'));document.querySelectorAll('[data-future]').forEach(b=>b.onclick=()=>switchPlatform('future'));document.querySelectorAll('[data-widget]').forEach(b=>b.onclick=()=>modal('小组件 / 元服务：未来概念','展示参考最晚窗口、真实数据更新时间与来源入口。必须有平台能力和服务端事件支撑；此页面不创建系统小组件或实况窗。'));document.querySelectorAll('[data-explore]').forEach(b=>b.onclick=()=>modal('未来用户旅程','看到可核验的公开事件 → 了解北京时间窗口 → 明确选择提醒类型 → 授权可用渠道 → 验证测试消息 → 随时撤销订阅。注册、通知和营销分别征求同意。'));document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>modal('团队角色边界','观察者只读事件；编辑者整理证据；运营者管理通知模板；管理员配置渠道与审计。查看私有仓库、账户数据或发送外部消息均需要单独授权。'));document.querySelectorAll('.tweet').forEach(c=>c.onkeydown=e=>{if(e.target!==c)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const n=postIndex+(e.key==='ArrowLeft'?-1:1);if(n>=0&&n<posts().length){e.preventDefault();postIndex=n;render();$('.tweet')?.focus();}}});document.querySelectorAll('[data-swipe]').forEach(h=>{let x=null,y=null;h.addEventListener('touchstart',e=>{if(e.touches.length===1){x=e.touches[0].clientX;y=e.touches[0].clientY;}},{passive:true});h.addEventListener('touchend',e=>{if(x===null)return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;x=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){const n=postIndex+(dx<0?1:-1);if(n>=0&&n<posts().length){postIndex=n;render();}}},{passive:true});});}
function tick(){if(document.hidden)return;const ps=posts(),p=ps[Math.min(postIndex,ps.length-1)],m=thirdMetric();document.querySelectorAll('[data-clock]').forEach(el=>el.textContent=cn(now(),true));document.querySelectorAll('[data-age]').forEach(el=>el.textContent=now()>=p.time?duration(now()-p.time):'时间异常，待核验');document.querySelectorAll('[data-rem-label]').forEach(el=>el.textContent=m[0]);document.querySelectorAll('[data-rem]').forEach(el=>el.textContent=m[1]);document.querySelectorAll('[data-rem-note]').forEach(el=>el.textContent=m[2]);}
function switchPlatform(p){platform=p;page='overview';render();}
function toggleTheme(){dark=!dark;document.documentElement.classList.toggle('dark',dark);}
function render(){const scroll=$('.mobile-content')?.scrollTop||0;$('#platforms').innerHTML=Object.entries(platforms).map(([id,n],i)=>`${i===5?'<span class="divider"></span>':''}<button data-platform="${id}" class="${platform===id?'active':''}" aria-pressed="${platform===id}">${n}</button>`).join('');$('#platforms').querySelectorAll('button').forEach(b=>b.onclick=()=>switchPlatform(b.dataset.platform));$('#root').innerHTML=platform==='web'?web():platform==='future'?future():platform==='system'?system():mobile();$('#scenario').value=scenario;bind();if($('.mobile-content'))$('.mobile-content').scrollTop=scroll;document.documentElement.classList.toggle('dark',dark);tick();}
$('#theme').onclick=toggleTheme;$('#dialog-close').onclick=()=>$('#dialog').close();$('#scenario').onchange=e=>{scenario=e.target.value;postIndex=posts().length-1;render();};document.addEventListener('visibilitychange',tick);
render();setInterval(tick,1000);
</script></body></html>
