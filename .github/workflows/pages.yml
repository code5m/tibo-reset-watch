name: Publish public site
on:
  push:
    branches: [main]
    paths:
      - "state/public-events.json"
      - "scripts/build-site.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
      - run: npm run check
      - name: Build site
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          WXPUSHER_SUBSCRIBE_URL: ${{ vars.WXPUSHER_SUBSCRIBE_URL }}
          ALIPAY_SUBSCRIBE_URL: ${{ vars.ALIPAY_SUBSCRIBE_URL }}
          SMS_SUBSCRIBE_URL: ${{ vars.SMS_SUBSCRIBE_URL }}
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
