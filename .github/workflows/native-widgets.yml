name: Native Widget Source Builds
on:
  pull_request:
    paths: ["native/widgets/**", ".github/workflows/native-widgets.yml"]
  push:
    branches: [main]
    paths: ["native/widgets/**", ".github/workflows/native-widgets.yml"]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck real WidgetKit source against iOS simulator SDK
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc -swift-version 5 -typecheck -parse-as-library \
            -sdk "$SDK" -target arm64-apple-ios17.0-simulator \
            native/widgets/ios/ResetWatchWidget.swift
      - run: plutil -lint native/widgets/ios/Info.plist
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile actual AppWidget library (not a signed app)
        run: gradle --no-daemon -p native/widgets/android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-widget-library-${{ github.sha }}
          path: |
            native/widgets/android/build/outputs/aar/
            native/widgets/android/build/reports/
          retention-days: 14
          if-no-files-found: warn
