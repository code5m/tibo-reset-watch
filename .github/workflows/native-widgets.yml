name: Native Widget Source Builds
on:
  pull_request:
    paths: ["native/widgets/**", ".github/workflows/native-widgets.yml"]
  push:
    branches: [main]
    paths: ["native/widgets/**", ".github/workflows/native-widgets.yml"]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck real WidgetKit source against iOS simulator SDK
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc -swift-version 5 -typecheck -parse-as-library \
            -sdk "$SDK" -target arm64-apple-ios17.0-simulator \
            native/widgets/ios/ResetWatchWidget.swift
      - run: plutil -lint native/widgets/ios/Info.plist
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify hosted runner Android SDK (no deprecated tools download)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output/native
          : "${ANDROID_HOME:?Hosted runner Android SDK missing}"
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME" | tee test-output/native/sdk.txt
          java -version 2>&1 | tee -a test-output/native/sdk.txt
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee -a test-output/native/sdk.txt
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" version | tee -a test-output/native/sdk.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile actual AppWidget library (not a signed app)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p native/widgets/android assembleDebug lintDebug 2>&1 | tee test-output/native/android-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-widget-library-${{ github.sha }}
          path: |
            native/widgets/android/build/outputs/aar/
            native/widgets/android/build/reports/
            test-output/native/
          retention-days: 14
          if-no-files-found: error
