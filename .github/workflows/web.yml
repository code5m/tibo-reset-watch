name: Web Build

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "database/**"
      - "package.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "database/**"
      - "package.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck --workspace @resetwatch/web
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://tibo-reset-watch.vercel.app
        run: npm run web:build
